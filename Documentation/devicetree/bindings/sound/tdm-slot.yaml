%YAML 1.2
---
$id: http://devicetree.org/schemas/sound/tdm-slot.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Time Division Multiplexing (TDM) Slot Parameters

maintainers:
  - Liam Girdwood <lgirdwood@gmail.com>

select: false

definitions:
  dai-tdm-slot-num:
    description: Number of slots in use
    $ref: /schemas/types.yaml#/definitions/uint32

  dai-tdm-slot-width:
    description: Width, in bits, of each slot
    $ref: /schemas/types.yaml#/definitions/uint32

  dai-tdm-slot-tx-mask:
    description: |
      Transmit direction slot mask. Optional. Drivers may specify an
      .xlate_tdm_slot_mask() to generate a slot mask dynamically.
      If neither this property nor a driver-specific function are
      specified, the default snd_soc_xlate_tdm_slot_mask() function
      will be used to generate a mask.
    $ref: /schemas/types.yaml#/definitions/uint32

  dai-tdm-slot-rx-mask:
    description: |
      Receive direction slot mask. Optional. Identical to TX mask.
    $ref: /schemas/types.yaml#/definitions/uint32
