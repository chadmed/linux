%YAML 1.2
---
$id: http://devicetree.org/schemas/sound/tdm-slot.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Time Division Multiplexing (TDM) Slot Parameters

maintainers:
  - Liam Girdwood <lgirdwood@gmail.com>

select: false

definitions:
  dai-tdm-slot-num:
    description: Number of slots in use
    $ref: /schemas/types.yaml#/definitions/uint32

  dai-tdm-slot-width:
    description: Width, in bits, of each slot
    $ref: /schemas/types.yaml#/definitions/uint32

  dai-tdm-slot-tx-mask:
    description: |
      Transmit direction slot mask. Optional. Drivers may specify an
      .xlate_tdm_slot_mask() to generate a slot mask dynamically.
      If neither this property nor a driver-specific function are
      specified, the default snd_soc_xlate_tdm_slot_mask() function
      will be used to generate a mask.
    $ref: /schemas/types.yaml#/definitions/uint32

  dai-tdm-slot-rx-mask:
    description: |
      Receive direction slot mask. Optional. Identical to TX mask.
    $ref: /schemas/types.yaml#/definitions/uint32

  dai-tdm-slot-tx-idle-mode:
    description: |
      Transmit direction idle slot mode. Optional. For hardware
      that can configure its behaviour during idle TDM slots via
      .set_tdm_idle(). "None" represents UB/unspecified behaviour
      and is the same as not setting this property.
    $ref: /schemas/types.yaml#/definitions/string
    enum:
      - none
      - zero
      - pulldown
      - hiz

  dai-tdm-slot-rx-idle-mode:
    description: |
      Receive direction idle slot mode. Optional. Identical to TX
      idle slot mode.
    $ref: /schemas/types.yaml#/definitions/string
    enum:
      - none
      - zero
      - pulldown
      - hiz

  dai-tdm-slot-tx-idle-mask:
    description: |
      Transmit direction idle slot mask. Optional. 1 represents
      a slot to apply the configured idle mode to, 0 represents
      an active transmit slot that should be ignored.
    $ref: /schemas/types.yaml#/definitions/uint32

  dai-tdm-slot-rx-idle-mask:
    description: |
      Receive direction idle slot mask. Optional. Identical to
      TX mask.
    $ref: /schemas/types.yaml#/definitions/uint32
